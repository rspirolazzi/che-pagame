# Build and deploy the ChePagame web app to the DigitalOcean server (feature 009).
# See specs/009-docker-deploy-workflows/contracts/workflows.md and the "Deploy" section of the
# README for the required GitHub secrets and variables.
name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  SERVICE: chepagame-frontend

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and type check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

  deploy:
    name: Build, push and deploy
    needs: verify
    # A manual run from another branch only verifies; production is deployed from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_SSH_FINGERPRINT: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DROPLET_IP DROPLET_USER SSH_PRIVATE_KEY \
            DROPLET_SSH_FINGERPRINT DOCKERHUB_NAMESPACE DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret or variable: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: |
          APP_VERSION=$(node -p "require('./web/package.json').version")
          echo "value=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata
        id: build_meta
        run: |
          {
            echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "sha_short=${GITHUB_SHA::7}"
            echo "release_tag=main-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.SERVICE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: web
          file: web/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.value }}
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_DATE=${{ steps.build_meta.outputs.date }}
            RELEASE_TAG=${{ steps.build_meta.outputs.release_tag }}
            GIT_SHA=${{ steps.build_meta.outputs.sha_short }}

      - name: Update container on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.5
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE: ${{ env.SERVICE }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,SERVICE
          script: |
            set -euo pipefail

            cd "$DEPLOY_PATH"

            docker compose pull "$SERVICE"
            # Recreate only this service and wait until its healthcheck passes.
            docker compose up -d --no-deps --wait --wait-timeout 180 "$SERVICE"

            # Remove dangling images (no tag, not used).
            docker image prune -f

            # Rollout report: services and the image tag actually running (pinned or latest).
            docker compose ps
            docker compose images "$SERVICE"
