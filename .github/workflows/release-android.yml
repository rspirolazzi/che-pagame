# Build, sign and publish the ChePagame Android App (feature 010, User Story 4).
# A tag mobile-v<version> (equal to `version` in mobile/app.config.ts) publishes a GitHub Release
# with the arm64 APK and the AAB; a manual run only uploads them as an artifact.
# See specs/010-android-release-hardening/contracts/release-build.md and the README section
# "Android release build" for the required GitHub secrets and variables.
name: Android release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and type check
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Test
        run: npm test -- --ci

  build:
    name: Build, sign and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_WEB_BASE_URL: ${{ vars.EXPO_PUBLIC_WEB_BASE_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_DONATION_URL: ${{ vars.EXPO_PUBLIC_DONATION_URL }}
    steps:
      - name: Check configuration
        working-directory: .
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD \
            ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD EXPO_PUBLIC_API_BASE_URL \
            EXPO_PUBLIC_WEB_BASE_URL EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret or variable: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Read app version
        id: app_version
        run: |
          VERSION=$(npx expo config --type public --json 2>/dev/null | node -e \
            'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Check tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          if [ "$TAG" != "mobile-v$VERSION" ]; then
            echo "::error::Tag $TAG does not match the App version $VERSION (expected mobile-v$VERSION)"
            exit 1
          fi

      - name: Write the upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Generate the native project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build APK (arm64) and AAB
        working-directory: mobile/android
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Collect binaries
        id: binaries
        env:
          VERSION: ${{ steps.app_version.outputs.value }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          APK="$RUNNER_TEMP/dist/chepagame-$VERSION-arm64.apk"
          AAB="$RUNNER_TEMP/dist/chepagame-$VERSION.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          (cd "$RUNNER_TEMP/dist" && sha256sum ./*.apk ./*.aab | sed 's| \./| |' > SHA256SUMS.txt)
          cat "$RUNNER_TEMP/dist/SHA256SUMS.txt"
          echo "dir=$RUNNER_TEMP/dist" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.app_version.outputs.value }}
          DIST: ${{ steps.binaries.outputs.dir }}
        run: |
          {
            echo "ChePagame $VERSION for Android."
            echo
            echo "- \`chepagame-$VERSION-arm64.apk\`: install directly on phones (arm64)."
            echo "- \`chepagame-$VERSION.aab\`: for Google Play."
            echo
            echo "Uninstall a ChePagame signed with another key before installing."
            echo "Check the APK on VirusTotal before sharing it."
            echo
            echo "SHA-256:"
            echo '```'
            cat "$DIST/SHA256SUMS.txt"
            echo '```'
          } > "$DIST/notes.md"
          gh release create "$TAG" "$DIST"/*.apk "$DIST"/*.aab "$DIST/SHA256SUMS.txt" \
            --title "ChePagame Android $VERSION" --notes-file "$DIST/notes.md"

      - name: Upload artifact (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: chepagame-android-${{ steps.app_version.outputs.value }}
          path: ${{ steps.binaries.outputs.dir }}
          if-no-files-found: error

      - name: Remove the upload keystore
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/upload.jks"
