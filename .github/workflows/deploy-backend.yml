# Build and deploy the ChePagame backend to the DigitalOcean server (feature 009).
# See specs/009-docker-deploy-workflows/contracts/workflows.md and the "Deploy" section of the
# README for the required GitHub secrets and variables.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  SERVICE: chepagame-backend

jobs:
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Start MongoDB (single-node replica set)
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval \
              "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }; db.hello().isWritablePrimary" \
              2>/dev/null | grep -q true; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set did not start" >&2
          exit 1

      - name: Prepare throwaway test secrets
        run: |
          for name in JWT_SECRET CODE_HASH_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Test
        env:
          ENVIRONMENT: test
          EMAIL_DELIVERY: console
          MONGODB_URI: mongodb://localhost:27017/?directConnection=true
        run: uv run pytest

  deploy:
    name: Build, push and deploy
    needs: verify
    # A manual run from another branch only verifies; production is deployed from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DROPLET_IP: ${{ secrets.DROPLET_IP }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DROPLET_SSH_FINGERPRINT: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          missing=0
          for name in DOCKERHUB_USERNAME DOCKERHUB_TOKEN DROPLET_IP DROPLET_USER SSH_PRIVATE_KEY \
            DROPLET_SSH_FINGERPRINT DOCKERHUB_NAMESPACE DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret or variable: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read app version
        id: app_version
        run: |
          APP_VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'])")
          echo "value=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare build metadata
        id: build_meta
        run: |
          {
            echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "sha_short=${GITHUB_SHA::7}"
            echo "release_tag=main-${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ vars.DOCKERHUB_NAMESPACE }}/${{ env.SERVICE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
          build-args: |
            APP_VERSION=${{ steps.app_version.outputs.value }}
            BUILD_NUMBER=${{ github.run_number }}
            BUILD_DATE=${{ steps.build_meta.outputs.date }}
            RELEASE_TAG=${{ steps.build_meta.outputs.release_tag }}
            GIT_SHA=${{ steps.build_meta.outputs.sha_short }}

      - name: Update container on DigitalOcean droplet
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          SERVICE: ${{ env.SERVICE }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.DROPLET_SSH_FINGERPRINT }}
          envs: DEPLOY_PATH,SERVICE
          script: |
            set -euo pipefail

            cd "$DEPLOY_PATH"

            docker compose pull "$SERVICE"
            # Recreate only this service and wait until its healthcheck passes.
            docker compose up -d --no-deps --wait --wait-timeout 180 "$SERVICE"

            # Remove dangling images (no tag, not used).
            docker image prune -f

            # Rollout report: services and the image tag actually running (pinned or latest).
            docker compose ps
            docker compose images "$SERVICE"
